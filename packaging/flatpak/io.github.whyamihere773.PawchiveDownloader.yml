app-id: io.github.whyamihere773.PawchiveDownloader
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pawchive
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal
modules:
  - name: pawchive-downloader
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/pawchive-downloader /app/bin
      - cp -a pawchive-downloader/. /app/pawchive-downloader/
      - chmod +x /app/pawchive-downloader/pawchive
      - rm -f /app/pawchive-downloader/updater /app/pawchive-downloader/install.sh /app/pawchive-downloader/uninstall.sh
      - install -Dm755 pawchive-flatpak-launcher.sh /app/bin/pawchive
      - install -Dm644 io.github.whyamihere773.PawchiveDownloader.desktop /app/share/applications/io.github.whyamihere773.PawchiveDownloader.desktop
      - install -Dm644 io.github.whyamihere773.PawchiveDownloader.metainfo.xml /app/share/metainfo/io.github.whyamihere773.PawchiveDownloader.metainfo.xml
      - install -Dm644 pawchive.png /app/share/icons/hicolor/512x512/apps/io.github.whyamihere773.PawchiveDownloader.png
    sources:
      - type: dir
        path: stage
